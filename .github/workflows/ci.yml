---
# The offline suite: T0, T1, T4.1, T4.6, T6.1-T6.3, T7.
#
# Everything here runs without a GPU, a target host, or a network beyond the
# package installs. The tiers that need real hardware (T2, T3, T5) are a manual
# checklist in PLAN.md, because a test that needs a GPU and forty minutes is not
# a test anyone runs.
#
# Every linter is installed rather than left to skip: tests/lint.sh degrades to
# SKIP when a tool is missing, which is right for a contributor's laptop and
# wrong for the one place that is supposed to be authoritative.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No cache: there is no lockfile to key it on, so an enabled cache would
      # never invalidate and would eventually serve stale tool versions.
      - uses: astral-sh/setup-uv@v5

      # uv tool install puts each CLI in its own environment on PATH, which is
      # how the repo tells contributors to install them. Keeping CI on the same
      # instructions means a failure here is reproducible locally.
      - name: Install the toolchain
        run: |
          uv tool install ansible-core
          uv tool install ansible-lint
          uv tool install yamllint
          uv tool install shellcheck-py
          uv pip install --system pyyaml

      - name: Install Ansible collections
        run: make deps

      - name: Show versions
        run: |
          python3 --version
          ansible-playbook --version | head -1
          ansible-lint --version | head -1
          yamllint --version
          shellcheck --version | grep version:
          jq --version
          docker --version

      - name: make test
        run: make test
