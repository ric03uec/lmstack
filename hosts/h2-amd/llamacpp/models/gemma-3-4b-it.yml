virtual_models:
  - name: gemma-3-4b-it
  - name: Gemma-3-4B-Instruct
notes: |
  Small general instruct model. Not in the default active set.

  Two uses: a fallback when the probe reports less than ~7 GiB of usable
  GPU memory, and a cheap second model on a 12 GiB+ machine for summarising
  or classification while the coder handles code.

  No --flash-attn: Gemma 3's attention does not benefit from it in the
  Vulkan backend, and enabling it has caused output corruption on some Mesa
  versions. Leave it off unless you have measured a win.

  Gemma tool calling is weaker than Qwen's at this size. Do not put this
  model behind an agent loop that depends on tool calls without running
  T3.4 against it first.
