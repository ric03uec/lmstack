---
# Prepares an AMD host to run llama.cpp over Vulkan. Run once per host.
#
#   make bootstrap HOST=h2-amd
#
# This host defaults to ansible_connection=local, so it is usually the machine
# you are sitting at. That means sudo will want a password:
#
#   ansible-playbook -i inventory/hosts.ini hosts/h2-amd/ansible/00-bootstrap.yml -K
#
# Vulkan rather than ROCm. ROCm supports a narrow list of discrete cards; the
# Vulkan backend runs on iGPUs, APUs and consumer dGPUs alike. For a repo whose
# promise is "works on the AMD machine you already have", portability beats peak
# throughput.
#
# Containers reach the GPU through the DRM render node with a numeric
# supplementary group — no host-side group membership required, because the
# docker daemon sets the container's groups rather than inheriting yours.

- name: Bootstrap AMD GPU host for lmstack
  hosts: h2-amd
  become: false
  gather_facts: true

  vars_files:
    - vars.yml

  tasks:
    - name: Verify a DRM render node exists
      ansible.builtin.stat:
        path: "{{ render_node }}"
      register: dri_render
      failed_when: not dri_render.stat.exists

    - name: Install system prerequisites
      become: true
      tags: sudo_required
      block:
        - name: Install apt prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - jq
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create apt keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        # -- Docker -------------------------------------------------------
        - name: Add Docker apt key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            filename: docker
            state: present

        - name: Install Docker engine and the compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
            update_cache: true

        # -- Vulkan -------------------------------------------------------
        # The llama.cpp server-vulkan image ships no drivers. The ICD and the
        # loader come from the host; vulkan-tools is what makes a broken setup
        # diagnosable instead of a silent fallback to CPU.
        - name: Install the Vulkan stack
          ansible.builtin.apt:
            name:
              - mesa-vulkan-drivers
              - libvulkan1
              - vulkan-tools
            state: present

        - name: Ensure Docker is running and enabled
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: true

        - name: Add the invoking user to the docker group
          ansible.builtin.user:
            name: "{{ ansible_user_id }}"
            groups: docker
            append: true
          register: docker_group

        # -- Firewall -----------------------------------------------------
        - name: Detect UFW
          ansible.builtin.command: which ufw
          register: ufw_present
          changed_when: false
          failed_when: false

        - name: Allow the LiteLLM gateway port through UFW
          community.general.ufw:
            rule: allow
            port: "{{ litellm_port }}"
            proto: tcp
          when: ufw_present.rc == 0

    - name: Report that a new login is needed for group membership
      ansible.builtin.debug:
        msg: >-
          {{ ansible_user_id }} was added to the docker group. On a local
          connection this does NOT take effect until you log out and back in —
          `make up HOST=h2-amd` will fail with a permission error until you do.
      when: docker_group.changed  # noqa: no-handler

    # -- Verification -----------------------------------------------------
    - name: Query the Vulkan device
      ansible.builtin.command: vulkaninfo --summary
      register: vulkan_summary
      changed_when: false
      failed_when: vulkan_summary.rc != 0

    - name: Verify Vulkan found a physical device
      ansible.builtin.assert:
        that:
          - "'deviceName' in vulkan_summary.stdout"
        fail_msg: >-
          vulkaninfo reports no physical device. The GPU will not be used and
          llama.cpp will fall back to CPU, which is slow enough to look broken.
          Check that mesa-vulkan-drivers matches your kernel's amdgpu driver.

    - name: Bootstrap summary
      ansible.builtin.debug:
        msg:
          - "Host is ready for lmstack."
          - "Render node:  {{ render_node }}"
          - "Vulkan:       {{ vulkan_summary.stdout_lines | select('search', 'deviceName') | first | trim }}"
          - "Next:         make up HOST={{ host_alias }}"
