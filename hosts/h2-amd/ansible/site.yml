---
# Everything, in order: prepare the host, bring the stack up, prove it works.
#
#   make site HOST=h2-amd
#
# Safe to re-run. Bootstrap is idempotent, the stack converges, and verify is
# read-only. On a local connection bootstrap needs -K for sudo.

- name: Import bootstrap
  ansible.builtin.import_playbook: 00-bootstrap.yml

- name: Import stack
  ansible.builtin.import_playbook: 10-stack.yml

- name: Import verify
  ansible.builtin.import_playbook: 20-verify.yml
