---
# Host variables for CHANGE_ME_HOST.
#
# The placeholders below are the values you have to decide. AGENTS.md in this
# directory lists them and explains how to find the rest.

host_alias: CHANGE_ME_HOST
engine: vllm

# User-space install root on the target host. No /etc, no /var/lib, no system
# unit — persistence comes from docker `restart: unless-stopped`.
install_root: "{{ ansible_user_dir }}/.lmstack"

# The gateway is the only externally reachable port. Engines bind 127.0.0.1.
litellm_port: 4000
litellm_image: ghcr.io/berriai/litellm:v1.88.1

# Set to a Tailscale IP to expose the endpoint only on your tailnet.
# See docs/operations/tailscale.
litellm_bind_address: "0.0.0.0"

# Writes full prompt and completion text to Postgres. Off by default; turn on
# only if you understand that it persists everything you send.
litellm_store_prompts: false

# Ceiling for the sum of vram_estimate_gib across active_models. Validation
# refuses to render a set that exceeds it. Use what the card actually has, not
# what you hope.
vram_budget_gib: CHANGE_ME_VRAM_BUDGET_GIB

# Models to serve. Every entry needs a matching vllm/models/<slug>.yml.
#
# Empty on purpose: choosing the model is the one decision the template cannot
# make for you. Copy a starting point from a configured host —
#
#   cp hosts/h1-nvidia/vllm/models/qwen2.5-coder-7b.yml hosts/<your-host>/vllm/models/
#
# then list its slug here. See docs: models/adding-a-model.
active_models: []
