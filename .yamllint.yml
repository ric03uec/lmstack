---
extends: default

ignore: |
  website/
  # Rendered artifacts. Their style is the template's business, not yamllint's.
  tests/golden/
  node_modules/

rules:
  # Ansible and Jinja templates routinely exceed 80 columns for good reasons.
  line-length:
    max: 120
    level: warning
  # `on:` in GitHub workflows is a legitimate key, not the boolean true.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  # The four rules below are not preferences — ansible-lint refuses to use a
  # yamllint config that disagrees with them, and drops its own fix mode.
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  # Ansible convention, and what ansible-lint expects. Applied to model YAMLs
  # too so there is one rule for every file in the repo.
  document-start:
    present: true
