<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-label="Cloud-model dev stack: user, Claude Code, Claude Cloud">
  <!-- The canvas is deliberately near-square, not landscape like stack-local.svg.
       This diagram is three boxes in a column; a 1200-wide canvas left ~430px of
       dead margin either side, and in a half-width slide column that shrank the
       type until the labels were unreadable on a projector. -->
  <defs>
    <marker id="arrow-cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6f88" />
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #2d6f88; stroke-width: 2; }
      .box-soft { fill: #e0eef4; stroke: #2d6f88; stroke-width: 2; }
      .lbl  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 26px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .sub  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .side { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; fill: #64748b; text-anchor: middle; }
      .flow { stroke: #2d6f88; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- User -->
  <rect class="box" x="210" y="40" width="200" height="80" rx="8" />
  <text class="lbl" x="310" y="80">User</text>

  <line class="flow" x1="310" y1="120" x2="310" y2="195" marker-end="url(#arrow-cloud)" />

  <!-- Claude Code -->
  <rect class="box-soft" x="95" y="205" width="430" height="140" rx="8" />
  <text class="lbl" x="310" y="248">Claude Code</text>
  <text class="sub" x="310" y="286">plugins · memory · generic prompts</text>
  <text class="sub" x="310" y="312">+ project context</text>

  <line class="flow" x1="310" y1="345" x2="310" y2="420" marker-end="url(#arrow-cloud)" />

  <!-- Claude Cloud -->
  <rect class="box" x="170" y="430" width="280" height="100" rx="8" />
  <text class="lbl" x="310" y="468">Claude Cloud</text>
  <text class="sub" x="310" y="502">frontier model</text>

  <!-- Callout -->
  <text class="side" x="310" y="588">3 boxes. It just works.</text>
</svg>
