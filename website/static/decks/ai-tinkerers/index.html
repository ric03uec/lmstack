<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LMStack — AI Tinkerers Seattle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="theme" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css" />
  <link rel="stylesheet" href="../lmstack.css" />
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md"
               data-separator="^\r?\n---\r?\n$"
               data-separator-vertical="^\r?\n--\r?\n$"
               data-separator-notes="^Note:">
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.min.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      history: true,
      transition: 'fade',
      slideNumber: 'c/t',
      center: false,
      width: 1280,
      height: 720,
      margin: 0.06,
      // Space is repurposed below (pause/play the cast on demo slides, no-op
      // elsewhere) so the presenter never advances a slide by mistake while
      // reaching for the pause key. Setting the keyCode to null disables
      // Reveal's own handler; arrows, PageUp/PageDown and clickers are
      // untouched and remain the way to move.
      keyboard: { 32: null },
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
    });

    Reveal.on('ready', () => {
      const seen = new WeakSet();

      // Players are created lazily, when their slide is first shown. Creating
      // them all up front means a recording has already looped several times
      // by the time you reach it.
      const mount = (slide) => {
        if (!slide || !window.AsciinemaPlayer) return;
        slide.querySelectorAll('.demo-player[data-cast]').forEach((el) => {
          if (seen.has(el)) return;
          // fit: 'width' measures the container once, at create time. If the
          // slide has not been laid out yet the container is 0px wide and the
          // terminal collapses to a couple of rows. Wait for layout, and if it
          // still has no width leave it unseen so the next visit retries.
          requestAnimationFrame(() => {
            if (seen.has(el) || el.clientWidth === 0) return;
            seen.add(el);
            // data-max-width shrinks the container before fit measures it, so a
            // 100-col cast that would otherwise render at 11-12px/char can be
            // pinned to a smaller size for slides where readability at the back
            // of the room matters less than fitting more content on screen.
            if (el.dataset.maxWidth) el.style.maxWidth = el.dataset.maxWidth + 'px';
            const player = AsciinemaPlayer.create(el.dataset.cast, el, {
              autoPlay: true,
              loop: true,
              theme: 'monokai',
              // fit:'width' scales the terminal to fill the panel width, with
              // all 24 rows always visible (no clipping of pi's bottom status
              // bar) and no empty void around a tiny native-size terminal.
              // Text size is then a function of the panel width: to make text
              // smaller, use a narrower panel via data-max-width; to make it
              // bigger, use a wider panel. That is the only knob.
              fit: 'width',
              // controls: true keeps the play/pause + progress bar visible even
              // when the pointer is elsewhere, which matters on a projector
              // where you cannot hover to reveal them.
              controls: true,
              speed: Number(el.dataset.speed) || 1,
              idleTimeLimit: Number(el.dataset.idle) || 2,
            });
            // Store the player + a live play/pause flag on the container so
            // the space handler below can find it. autoPlay starts us in the
            // playing state; the two listeners keep the flag honest whether
            // the user hits space, clicks the on-screen controls, or the
            // player loops back to the beginning.
            el._apPlayer = player;
            el._apPlaying = true;
            player.addEventListener('play',  () => { el._apPlaying = true;  });
            player.addEventListener('pause', () => { el._apPlaying = false; });
          });
        });
      };

      mount(Reveal.getCurrentSlide());
      Reveal.on('slidechanged', (e) => mount(e.currentSlide));

      // Space is the pause/play key. On a demo slide with a mounted cast it
      // toggles the player; anywhere else it does nothing at all — the intent
      // is that a stray space press never moves the deck.
      //
      // Registered in the capture phase, with stopImmediatePropagation on the
      // active branches, because asciinema-player 3 installs its own space
      // handler on its root element. Without capture, once the user clicks
      // into a player it grabs focus, both handlers fire in the bubble phase,
      // and the two toggles cancel out — that was harvest working but exec
      // looking dead. Running first lets us take the key and stop it there.
      window.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' && e.key !== ' ') return;
        // Do not fight the user when they are typing in speaker notes, the
        // slide URL, or any input control.
        const t = e.target;
        if (t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        const slide = Reveal.getCurrentSlide();
        const el = slide && slide.querySelector('.demo-player[data-cast]');
        if (!el || !el._apPlayer) return;
        (el._apPlaying ? el._apPlayer.pause() : el._apPlayer.play());
      }, true);
    });
  </script>
</body>
</html>
